datasetId = fungi-lite
datasetAccession = KnetMiner:Fungi-lite
datasetTitle = Knetminer's knowledge graph about fungi (lite)
datasetDescription = \
  Knetminer is a gene discovery platform, which allows for exploring knwoledge graphs computed \
  from common biology data, such as ENSEMBL, UniProt, PHI-base, PUBMED and more.\n\
	The fungi-lite dataset contains information about 4 fungal species (5 genomes), which is also linked \
	to embedded data about the Yeast model organism.\n\
	This edition includes Saccharomyces cerevisiae, Fusarium culmorum (two genomes: UK99 v3 with annotation v1, and Ensembl EF1), \
	Fusarium graminearum, Schizosaccharomyces pombe, Zymoseptoria tritici.
datasetVersion = 63
# TODO: better URLs
datasetURL = https://knetminer.com/about
datasetNeo4jBrowserURL = <http://localhost:7474>
datasetNeo4jBOLTURL = <bolt://localhost:7687>
